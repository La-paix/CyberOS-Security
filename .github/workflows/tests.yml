name: Python tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-tested.txt
      - name: Test core
        run: python tests/run_tests.py
      - name: Test GUI (Windows)
        if: runner.os == 'Windows'
        run: python tests/run_tests.py --gui
      - name: Test GUI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/run_tests.py --gui
